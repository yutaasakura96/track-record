# Local Postgres, for development and for the test suite.
#
# TWO DATABASES, not one. The suite drops and rebuilds `public` on every run
# (`docs/11-testing-plan.md` §1) — pointed at the database the dev worker uses,
# that silently destroys the session, the profile, the imported documents and
# every accepted render version. `track_record_dev` is what `.dev.vars` points
# at; `track_record_test` is the suite's, and only the suite's.
#
# `POSTGRES_DB` creates the dev database, and only on a first, empty volume.
# `npm run db:up` runs `scripts/ensure-databases.mjs` afterwards, which creates
# whichever of the two is missing — including on a volume that predates this.
#
# TWO SERVICES, not one. The application talks to Postgres over Neon's HTTP
# protocol, which plain Postgres does not implement — so a Neon proxy sits in
# front of it. Without the proxy every database test fails at connection time.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: track_record_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      # This is the proxy's AUTH backend, not the query target: on startup it
      # creates `neon_control_plane.endpoints` in whatever database this names,
      # and looks roles up there. The database each QUERY runs against comes
      # from the connection string the client sends, so one proxy serves both —
      # asserted at the top of every suite run by the `current_database()` check
      # in `tests/global-setup.ts`.
      #
      # `postgres`, deliberately: the proxy's own bookkeeping does not belong in
      # an application database, and the maintenance database always exists —
      # naming either of ours would mean the proxy could not start until
      # `scripts/ensure-databases.mjs` had run.
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/postgres
    ports: ["4444:4444"]
    depends_on:
      postgres: { condition: service_healthy }
