# Local test database.
#
# Two services, not one. The application talks to Postgres over Neon's HTTP
# protocol, which plain Postgres does not implement — so a Neon proxy sits in
# front of it. Without the proxy every database test fails at connection time.
# See docs/11-testing-plan.md §1.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: track_record_test
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/track_record_test
    ports: ["4444:4444"]
    depends_on:
      postgres: { condition: service_healthy }
