# no-mistakes gate config. With allow_repo_commands disabled, the commands,
# agent, and pr.base_branch are read only from the default branch's (develop)
# copy, so this file must exist there too.
allow_repo_commands: false

commands:
  # The run worktree has tracked files only; copy any local, gitignored env files in.
  prepare: 'for f in .env .env.local .env.develop.local; do [ -f "$HOME/Documents/GitHub/track-record/$f" ] && cp "$HOME/Documents/GitHub/track-record/$f" .; done; true && npm ci --prefer-offline'
  lint: "npm run lint && npm run typecheck"

pr:
  base_branch: develop

test:
  instructions: |
    Start local Postgres with `npm run db:up`, then `npm run dev` (Vite) or
    `npm run dev:worker` (wrangler) and drive the changed flow in a browser the way
    a user would. Unit and integration tests: `npm test`.
  evidence:
    attach_media: true
