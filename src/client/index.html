<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The record holds PII and NDA-bound material. Nothing about it belongs
         in a search index or a referrer sent to another origin. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <!-- Light is the default; dark is the author's choice, kept for this
         browser (`docs/05`). Set before first paint, so a dark reader never
         sees a light flash. `stores/theme.ts` owns the same key. -->
    <script>
      try {
        if (localStorage.getItem("track-record:theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <title>Track Record</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
