name = "track-record"
main = "src/server/index.ts"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]

# The production address is the Worker's workers.dev URL, the only front door:
# there is no custom domain (docs/06, 2026-09-28, "Production serves from
# workers.dev"). Stated, not defaulted, so a dashboard toggle cannot quietly
# change what the next deploy serves. See docs/13-infrastructure-security.md §3.
workers_dev = true
# SECURITY — do not remove. Preview URLs give every uploaded version its own
# public workers.dev address, a second front door onto the same record. Omitted,
# Wrangler leaves an existing setting alone, so one enabled in the dashboard
# would survive every deploy.
preview_urls = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, a top-level navigation to /api/* carries `Sec-Fetch-Mode: navigate`,
# misses every static asset, and is answered by `not_found_handling` — i.e. the SPA
# shell — instead of reaching the Worker. Naming the API prefix opts /api out of that
# implicit routing. Verified against the Workers static-assets documentation, 2026-08-30.
run_worker_first = ["/api/*"]

[limits]
# Paid plan default is 30s; raisable to 300_000. Raise only if the .docx
# assembly spike shows it is needed — see docs/03-technical-design.md §11.
cpu_ms = 30000

[observability]
enabled = true

# Secrets are set with `wrangler secret put NAME` and never committed:
#   DATABASE_URL  ANTHROPIC_API_KEY  BETTER_AUTH_SECRET  BETTER_AUTH_URL
#   GOOGLE_CLIENT_ID  GOOGLE_CLIENT_SECRET  ALLOWED_SIGNUP_EMAILS
[vars]
ANTHROPIC_MODEL = "claude-opus-5"

# The import pipeline. `runImport()` is the implementation; this class is a thin
# adapter that wraps each step in `step.do` (docs/06, 2026-08-30). When the binding
# is absent — tests, and local dev without a Workflows-capable server — the same
# function runs inline. See src/pipeline/workflow.ts.
[[workflows]]
name = "track-record-import"
binding = "IMPORT_WORKFLOW"
class_name = "ImportWorkflow"

# The 履歴書 template is a binary module. Without a rule wrangler tries to parse
# the .docx as JavaScript; `Data` imports it as an ArrayBuffer.
# `fallthrough` keeps wrangler's implicit default rules (notably `.bin` as Data)
# in play; without it wrangler warns that this rule shadows them.
[[rules]]
type = "Data"
globs = ["**/*.docx"]
fallthrough = true
