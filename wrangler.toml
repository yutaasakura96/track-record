name = "track-record"
main = "src/server/index.ts"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]

# SECURITY — do not remove.
# Cloudflare issues every Worker a *.workers.dev address. It is an unnecessary
# second front door on an app holding PII and NDA-bound client material.
# Disabling this in the dashboard alone does NOT persist: Cloudflare re-enables
# the route on the next `wrangler deploy` unless this line is present.
# See docs/13-infrastructure-security.md §3.
workers_dev = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[limits]
# Paid plan default is 30s; raisable to 300_000. Raise only if the .docx
# assembly spike shows it is needed — see docs/03-technical-design.md §11.
cpu_ms = 30000

[observability]
enabled = true

# Secrets are set with `wrangler secret put NAME` and never committed:
#   DATABASE_URL  ANTHROPIC_API_KEY  BETTER_AUTH_SECRET  BETTER_AUTH_URL
#   GOOGLE_CLIENT_ID  GOOGLE_CLIENT_SECRET  ALLOWED_SIGNUP_EMAILS
[vars]
ANTHROPIC_MODEL = "claude-opus-5"
